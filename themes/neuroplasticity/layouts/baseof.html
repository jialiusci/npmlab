<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header>
    <div class="container">
      <div class="site-title">
        <a href="{{ "/" | relURL }}">{{ site.Title }}</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('nav ul').classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
      {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
    </div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
