{{ define "main" }}
  <div class="page-header">
    <div class="container">
      <h1>{{ .Title }}</h1>
      {{ with .Params.subtitle }}<p>{{ . }}</p>{{ end }}
    </div>
  </div>
  <div class="container">
    <div class="page-content">
      {{ .Content }}
      {{ range .Pages }}
        <div class="news-item">
          <h3>{{ .Title }}</h3>
          <div class="news-date">{{ .Date | time.Format ":date_long" }}</div>
          <p>{{ .Summary }}</p>
        </div>
      {{ end }}
    </div>
  </div>
{{ end }}
